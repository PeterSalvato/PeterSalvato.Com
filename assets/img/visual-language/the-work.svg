<svg width="380" height="360" viewBox="0 0 380 360" xmlns="http://www.w3.org/2000/svg">
  <!-- RGB Venn — Design, Engineering, Governance -->
  <!-- Three overlapping circles with transparency for overprint effect -->

  <defs>
    <!-- Use mix-blend-mode for color mixing -->
  </defs>

  <g style="mix-blend-mode: multiply;">
    <!-- Design (red, top-left) -->
    <circle cx="148" cy="139" r="130" fill="rgba(166, 75, 42, 0.7)" stroke="#a64b2a" stroke-width="1.5"/>
  </g>

  <g style="mix-blend-mode: multiply;">
    <!-- Engineering (blue, top-right) -->
    <circle cx="232" cy="139" r="130" fill="rgba(58, 95, 133, 0.7)" stroke="#3a5f85" stroke-width="1.5"/>
  </g>

  <g style="mix-blend-mode: multiply;">
    <!-- Governance (green, bottom) -->
    <circle cx="190" cy="220" r="130" fill="rgba(107, 142, 95, 0.7)" stroke="#6b8e5f" stroke-width="1.5"/>
  </g>
</svg>
