title: "Peter Salvato"
description: "Peter Salvato. Design engineer. Construction sites, print shops, enterprise platforms, brand systems, classrooms."
author: "Peter Salvato"
email: "ptsalvato@gmail.com"
url: "https://petersalvato.com"
baseurl: ""

# SEO Keywords (Dual-Layer Strategy)
seo_keywords: ["Design Engineer", "Design Systems", "Systems Architecture", "Information Architecture", "Operational Methodology", "AI Implementation", "Visual Communication", "SVA", "AI Governance"]

# Jekyll Collections
collections:
  practice:
    output: true
    permalink: /practice/:path/
  research:
    output: true
    permalink: /research/:path/
  systems:
    output: true
    permalink: /systems/:path/
  evidence:
    output: true
    permalink: /evidence/:path/
  essays:
    output: true
    permalink: /essays/:path/
  homeworks:
    output: true
    permalink: /essays/:path/
  ei:
    output: true
    permalink: /essays/:path/
  versograms:
    output: true
    permalink: /versograms/:path/
  photogeography:
    output: true
    permalink: /photogeography/:path/
  # Retired pages (no output)
  retired:
    output: false

plugins:
  - jekyll-redirect-from

# Build settings
markdown: kramdown
permalink: pretty

# SASS/SCSS processing
sass:
  sass_dir: assets/css
  style: compressed

# Exclude from build
exclude:
  - README.md
  - CLAUDE.md
  - CONTENT-STRATEGY.md
  - DEV.md
  - GEMINI.md
  - assets/ContentChat.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - docs/
  - .gitignore
  - .github/

# GitHub Pages configuration (GitHub Actions deployment)
remote_theme: null
theme: null
