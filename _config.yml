title: "Peter Salvato"
description: "Peter Salvato. Classically trained designer. Four technology shifts and counting. I figured out how to keep the eye intact when the tools change."
author: "Peter Salvato"
email: "ptsalvato@gmail.com"
url: "https://petersalvato.com"
baseurl: ""

# SEO Keywords (Dual-Layer Strategy)
seo_keywords: ["Peter Salvato", "voice governance", "brand coherence", "AI creative practice", "lens extraction", "structural design thinking", "SVA", "brand voice AI", "creative AI methodology"]

# Jekyll Collections
collections:
  work:
    output: true
    permalink: /work/:path/
  practice:
    output: true
    permalink: /practice/:path/
  brandwalks:
    output: true
    permalink: /brandwalks/:path/
  research:
    output: true
    permalink: /research/:path/
  systems:
    output: true
    permalink: /systems/:path/
  essays:
    output: true
    permalink: /essays/:path/
  homeworks:
    output: false
    permalink: /essays/:path/
  ei:
    output: true
    permalink: /essays/:path/
  versograms:
    output: true
    permalink: /versograms/:path/
  photogeography:
    output: true
    permalink: /photogeography/:path/
  # Retired pages (no output)
  retired:
    output: false

plugins:
  - jekyll-redirect-from

# Build settings
markdown: kramdown
permalink: pretty

# SASS/SCSS processing
sass:
  sass_dir: assets/css
  style: compressed

# Exclude from build
exclude:
  - README.md
  - CLAUDE.md
  - CONTENT-STRATEGY.md
  - DEV.md
  - GEMINI.md
  - assets/ContentChat.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - docs/
  - .gitignore
  - .github/

# GitHub Pages configuration (GitHub Actions deployment)
remote_theme: null
theme: null
