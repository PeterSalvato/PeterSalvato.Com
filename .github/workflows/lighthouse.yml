name: Lighthouse CI

on:
  workflow_run:
    workflows: ["Build and Deploy Jekyll Site"]
    types: [completed]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      # GitHub Pages takes a few seconds to propagate after deploy
      - name: Wait for Pages to propagate
        run: sleep 30

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://petersalvato.com/
            https://petersalvato.com/governance/savepoint-syntax/
            https://petersalvato.com/infrastructure/pressworks/
            https://petersalvato.com/output/aiden-jae/
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
