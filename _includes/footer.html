    <div class="footer-columns">
        <!-- Column 1: Work -->
        <div class="footer-column">
            <h4>Work</h4>
            <ul>
                <li><a href="{{ '/practice/whitepapers/' | relative_url }}">Whitepapers</a></li>

                <li><a href="{{ '/evidence/' | relative_url }}">Applied Work</a></li>

        <!-- Column 2: Context -->
        <div class="footer-column">
