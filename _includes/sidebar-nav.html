<aside id="sidebar-nav" aria-label="Main site navigation">
  <div id="sidebar-header">
    <h1 id="sidebar-title"><a href="{{ '/' | relative_url }}">PETER SALVATO</a></h1>
  </div>

  <nav id="sidebar-menu" aria-label="Site sections">
    <ul class="nav-list">
      {% for item in site.data.navigation.items %}
        {%- assign item_path = item.url | append: '/' -%}
        <li>
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.url == item_path %} class="is-active"{% endif %}><span class="material-symbols-outlined nav-icon">{{ item.icon | default: 'article' }}</span><span class="nav-text">{{ item.label }}</span></a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</aside>
