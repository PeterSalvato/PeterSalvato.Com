---
layout: default
---

<!-- Homepage Hero -->
<div id="homepage-hero">
    <img class="hero-image" src="{{ '/assets/img/ppp-mark-draft.png' | relative_url }}"
         alt="PPP brand mark — three registration plates of a P in governance red, infrastructure blue, and output green"
         loading="eager">
    <div class="hero-text">
        <h1>Peter Salvato</h1>
        <p class="hero-role">Design Engineer</p>
    </div>
</div>

{% if content != "" %}
<div id="homepage-intro">
    {{ content }}
</div>
{% endif %}

<!-- Section Cards — mirror the nav, explain the depth -->
<div id="section-cards">
    {% for route in site.data.index.routes %}
    <a href="{{ route.url | relative_url }}" class="section-card artifact-card artifact-card--link" data-section="{{ route.name | downcase }}">
        <h3 class="section-card-name">{{ route.name }}</h3>
        <p class="section-card-definition">{{ route.definition }}</p>
        <p class="section-card-description">{{ route.description }}</p>
        <p class="artifact-link">Explore &rarr;</p>
    </a>
    {% endfor %}
</div>

<script>
  document.querySelectorAll('.section-card[data-section]').forEach(function(card) {
    var key = card.getAttribute('data-section');
    var navSection = document.querySelector('.nav-section[data-section="' + key + '"]');
    if (!navSection) return;
    card.addEventListener('mouseenter', function() {
      navSection.classList.add('is-highlighted');
    });
    card.addEventListener('mouseleave', function() {
      navSection.classList.remove('is-highlighted');
    });
  });
</script>
